! leaf1 — VTEP. Underlay eBGP to both spines + EVPN overlay.
! ASN 65001, loopback 10.0.0.1 (VTEP source). Host h1 on eth3, VNI 10010.
!
! NOTE: the loopback (VTEP IP), bridge, and VXLAN interface are created by the
! node's `exec` block in topology.clab.yml, so FRR only runs routing here.
! `advertise-all-vni` discovers VNI 10010 from the kernel automatically.
frr defaults datacenter
!
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor eth1 interface remote-as external
 neighbor eth2 interface remote-as external
 !
 address-family ipv4 unicast
  network 10.0.0.1/32
  neighbor eth1 activate
  neighbor eth2 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor eth1 activate
  neighbor eth2 activate
  advertise-all-vni
 exit-address-family
!
