! spine1 — underlay route reflector-free eBGP + EVPN transit
! ASN 65101, loopback 10.0.0.101
frr defaults datacenter
!
interface lo
 ip address 10.0.0.101/32
!
router bgp 65101
 bgp router-id 10.0.0.101
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 ! Unnumbered eBGP to each leaf over the fabric links
 neighbor eth1 interface remote-as external
 neighbor eth2 interface remote-as external
 neighbor eth3 interface remote-as external
 neighbor eth4 interface remote-as external
 !
 address-family ipv4 unicast
  network 10.0.0.101/32
  neighbor eth1 activate
  neighbor eth2 activate
  neighbor eth3 activate
  neighbor eth4 activate
 exit-address-family
 !
 ! EVPN overlay — spine only transits Type-2/Type-3 routes between leaves
 address-family l2vpn evpn
  neighbor eth1 activate
  neighbor eth2 activate
  neighbor eth3 activate
  neighbor eth4 activate
 exit-address-family
!
