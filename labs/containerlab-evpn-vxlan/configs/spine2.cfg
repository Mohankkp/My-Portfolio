! spine2 — underlay eBGP + EVPN transit
! ASN 65102, loopback 10.0.0.102
frr defaults datacenter
!
interface lo
 ip address 10.0.0.102/32
!
router bgp 65102
 bgp router-id 10.0.0.102
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor eth1 interface remote-as external
 neighbor eth2 interface remote-as external
 neighbor eth3 interface remote-as external
 neighbor eth4 interface remote-as external
 !
 address-family ipv4 unicast
  network 10.0.0.102/32
  neighbor eth1 activate
  neighbor eth2 activate
  neighbor eth3 activate
  neighbor eth4 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor eth1 activate
  neighbor eth2 activate
  neighbor eth3 activate
  neighbor eth4 activate
 exit-address-family
!
